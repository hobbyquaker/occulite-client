name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.2.0)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # trusted publishing (OIDC) needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check tag matches package.json
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
      # a version published by hand (e.g. the very first one) is skipped, so the
      # GitHub release can still be created via workflow_dispatch
      - name: Publish
        run: |
          NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm, skipping publish"
          else
            npm publish --provenance --access public
          fi

  github-release:
    runs-on: ubuntu-latest
    needs: [npm]
    steps:
      # default branch checkout (not the tag) so the notes script is present even when
      # releasing an older tag via workflow_dispatch; the script reads the CHANGELOG from the tag
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Generate release notes
        run: node .github/release-notes.mjs "${{ inputs.tag || github.ref_name }}" > /tmp/notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md --verify-tag $PRERELEASE
